name: Deploy legal pages to Firebase Hosting

# Publishes the static legal pages in legal/ to Firebase Hosting.
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — the JSON key of a Firebase service account
#   FIREBASE_PROJECT_ID      — the Firebase project id (e.g. habit-forge-1a2b3)
on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .
