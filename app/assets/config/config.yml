achievement_defs:
  - id: first_task
    title: First Blood
    description: Complete your first task
    condition_type: total_tasks
    threshold: 1
    gem_reward: 5

  - id: streak_7
    title: Hot Streak
    description: 7-day streak
    condition_type: streak
    threshold: 7
    gem_reward: 5

  - id: streak_30
    title: Unstoppable
    description: 30-day streak
    condition_type: streak
    threshold: 30
    gem_reward: 10

  - id: level_5
    title: Growing Strong
    description: Reach level 5
    condition_type: level
    threshold: 5
    gem_reward: 5

  - id: level_10
    title: Double Digits
    description: Reach level 10
    condition_type: level
    threshold: 10
    gem_reward: 10

  - id: tasks_50
    title: Getting Things Done
    description: Complete 50 tasks
    condition_type: total_tasks
    threshold: 50
    gem_reward: 5

  - id: tasks_100
    title: Task Master
    description: Complete 100 tasks
