syntax = "proto3";

package api.character.v1;

import "google/api/annotations.proto";

import "api/shared/v1/shared.proto";


option go_package = "github.com/habitforge/backend/api/character/v1;v1";

// CharacterService — RPG character state: class, level, EXP, HP, stats, equipment.
service CharacterService {
  // CreateCharacter returns the current user's character.
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterReply) {
    option (google.api.http) = {
      post: "/api/v1/character"
      body: "*"
    };
  }
  // GetCharacter returns the current user's character.
  rpc GetCharacter(GetCharacterRequest) returns (GetCharacterReply) {
    option (google.api.http) = {
      get: "/api/v1/character"
    };
  }
  // UpdateCharacter replaces the character state (level/exp/hp/stats/equipment).
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterReply) {
    option (google.api.http) = {
      put: "/api/v1/character"
      body: "*"
    };
  }
  // AllocateStatPoint spends one available stat point on an attribute.
  rpc AllocateStatPoint(AllocateStatPointRequest) returns (AllocateStatPointReply) {
    option (google.api.http) = {
      post: "/api/v1/character/stats/allocate"
      body: "*"
    };
  }
  // Revive revives a dead character (e.g. after the recovery timer).
  rpc Revive(ReviveRequest) returns (ReviveReply) {
    option (google.api.http) = {
      post: "/api/v1/character/revive"
      body: "*"
    };
  }

  rpc EquipItem(EquipItemRequest) returns (EquipItemReply) {
    option (google.api.http) = {
      post: "/api/v1/character/equip"
      body: "*"
    };
  }
}

// CharacterClass — playable character classes.
enum CharacterClass {
  // Unspecified class; used as the zero value.
  CHARACTER_CLASS_UNSPECIFIED = 0;
  // Warrior — melee combat class.
  CHARACTER_CLASS_WARRIOR = 1;
  // Mage — spellcasting class.
  CHARACTER_CLASS_MAGE = 2;
  // Ranger — ranged combat class.
  CHARACTER_CLASS_RANGER = 3;
}

// StatType — character attributes.
enum StatType {
  // Unspecified stat; used as the zero value.
  STAT_TYPE_UNSPECIFIED = 0;
  // Strength — physical power.
  STAT_TYPE_STRENGTH = 1;
  // Intelligence — magical power.
  STAT_TYPE_INTELLIGENCE = 2;
  // Agility — speed and precision.
  STAT_TYPE_AGILITY = 3;
  // Defense — reduces damage taken.
  STAT_TYPE_DEFENSE = 4;
  // Vitality — maximum HP.
  STAT_TYPE_VITALITY = 5;
  // Luck — random outcomes such as criticals and drops.
  STAT_TYPE_LUCK = 6;
}

// CharacterStats — base attribute values.
message CharacterStats {
  // Strength attribute.
  int32 strength = 1;
  // Intelligence attribute.
  int32 intelligence = 2;
  // Agility attribute.
  int32 agility = 3;
  // Defense attribute.
  int32 defense = 4;
  // Vitality attribute.
  int32 vitality = 5;
  // Luck attribute.
  int32 luck = 6;
}

// Character — the current user's RPG character state.
message Character {
  // Unique character id.
  string id = 1;
  // Chosen character class.
  CharacterClass character_Class = 2;
  // Current level (max 50).
  int32 level = 3;
  // EXP accumulated toward the next level.
  int64 current_exp = 4;
  // Current HP (max 100); reaches 0 when dead.
  int32 current_hp = 5;
  // Base attribute values.
  CharacterStats base_stats = 6;
  // Unspent stat points available for allocation (1 per level).
  int32 available_stat_points = 7;
  // Equipped items: equipment slot -> shop item id (weapon/helmet/armor/accessory).
  map<string, string> equipment = 8;
  // Whether the character is dead (unusable until revived).
  bool is_dead = 9;
  // Time when the death recovery finishes, unix millis.
  int64 death_recovery_until = 10;
}

// CreateCharacterRequest
message CreateCharacterRequest {  
  CharacterClass characterClass = 1;
}

// CreateCharacterReply
message CreateCharacterReply {
  Character character = 1;
}
// GetCharacterRequest — no parameters; the character belongs to the current user.
message GetCharacterRequest {}

// GetCharacterReply — the user's character.
message GetCharacterReply {
  Character character = 1;
}

// UpdateCharacterRequest — full character state to persist.
message UpdateCharacterRequest {
  // Character payload to save (full replace).
  Character character = 1;
}

// UpdateCharacterReply — the saved character state.
message UpdateCharacterReply {
  // The persisted character.
  Character character = 1;
}

// AllocateStatPointRequest — the attribute to invest one stat point into.
message AllocateStatPointRequest {
  // The attribute to increase.
  StatType stat = 1;
}

// AllocateStatPointReply — the updated character after allocation.
message AllocateStatPointReply {
  // Character with the allocated point applied.
  Character character = 1;
}

// ReviveRequest — no parameters; revives the current user's character.
message ReviveRequest {}

// ReviveReply — the revived character state.
message ReviveReply {
  // Character with death cleared and recovery HP restored.
  Character character = 1;
}


// EquipItemRequest — no parameters; equips the current user's character.
message EquipItemRequest {
  string itemId = 1;
 api.shared.v1.EquipmentSlot slot = 2;
}


// EquipItemReply — the equipped character state.
message EquipItemReply {}
