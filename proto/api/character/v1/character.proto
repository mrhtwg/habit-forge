syntax = "proto3";

package api.character.v1;

import "google/api/annotations.proto";

option go_package = "github.com/habitforge/backend/api/character/v1;v1";

// CharacterService — RPG character state: class, level, EXP, HP, stats, equipment.
service CharacterService {
  // GetCharacter returns the current user's character.
  rpc GetCharacter(GetCharacterRequest) returns (GetCharacterReply) {
    option (google.api.http) = {
      get: "/api/v1/character"
    };
  }
  // UpdateCharacter replaces the character state (level/exp/hp/stats/equipment).
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterReply) {
    option (google.api.http) = {
      put: "/api/v1/character"
      body: "*"
    };
  }
  // AllocateStatPoint spends one available stat point on an attribute.
  rpc AllocateStatPoint(AllocateStatPointRequest) returns (AllocateStatPointReply) {
    option (google.api.http) = {
      post: "/api/v1/character/stats/allocate"
      body: "*"
    };
  }
  // Revive revives a dead character (e.g. after the recovery timer).
  rpc Revive(ReviveRequest) returns (ReviveReply) {
    option (google.api.http) = {
      post: "/api/v1/character/revive"
      body: "*"
    };
  }
}

// CharacterType - character class.
enum CharacterClass {
  CHARACTER_CLASS_UNSPECIFIED = 0;
  CHARACTER_CLASS_WARRIOR = 1;
  CHARACTER_CLASS_MAGE = 2;
  CHARACTER_CLASS_RANGER = 3;
}

// StatType — character attributes.
enum StatType {
  STAT_TYPE_UNSPECIFIED = 0;
  STAT_TYPE_STRENGTH = 1;
  STAT_TYPE_INTELLIGENCE = 2;
  STAT_TYPE_AGILITY = 3;
  STAT_TYPE_DEFENSE = 4;
  STAT_TYPE_VITALITY = 5;
  STAT_TYPE_LUCK = 6;
}

message CharacterStats {
  int32 strength = 1;
  int32 intelligence = 2;
  int32 agility = 3;
  int32 defense = 4;
  int32 vitality = 5;
  int32 luck = 6;
}

message Character {
  string id = 1;
  CharacterClass character_Class = 2;
  int32 level = 3;
  int64 current_exp = 4;
  int32 current_hp = 5;
  CharacterStats base_stats = 6;
  int32 available_stat_points = 7;
  map<string, string> equipment = 8; // weapon/helmet/armor/accessory -> shop item id
  bool is_dead = 9;
  int64 death_recovery_until = 10; // unix millis
}

message GetCharacterRequest {}

message GetCharacterReply {
  Character character = 1;
}

message UpdateCharacterRequest {
  Character character = 1;
}

message UpdateCharacterReply {
  Character character = 1;
}

message AllocateStatPointRequest {
  StatType stat = 1;
}

message AllocateStatPointReply {
  Character character = 1;
}

message ReviveRequest {}

message ReviveReply {
  Character character = 1;
}
