syntax = "proto3";

package api.shop.v1;

import "google/api/annotations.proto";

import "api/shared/v1/shared.proto";

option go_package = "github.com/habitforge/backend/api/shop/v1;v1";

// ShopService — Forge shop: items, daily deals, purchases, owned items.
service ShopService {
  // ListShopItems lists all purchasable shop items.
  rpc ListShopItems(ListShopItemsRequest) returns (ListShopItemsReply) {
    option (google.api.http) = {
      get: "/api/v1/shop/items"
    };
  }
  // GetDailyDeal returns the current rotating discounted item.
  rpc GetDailyDeal(GetDailyDealRequest) returns (GetDailyDealReply) {
    option (google.api.http) = {
      get: "/api/v1/shop/daily-deal"
    };
  }
  // BuyItem purchases an item with gold or gems.
  rpc BuyItem(BuyItemRequest) returns (BuyItemReply) {
    option (google.api.http) = {
      post: "/api/v1/shop/items/{item_id}/buy"
      body: "*"
    };
  }
  // ListOwnedItems lists items the current user owns.
  rpc ListOwnedItems(ListOwnedItemsRequest) returns (ListOwnedItemsReply) {
    option (google.api.http) = {
      get: "/api/v1/shop/owned"
    };
  }
}

// ShopCurrency — purchase currency.
enum ShopCurrency {
  // Unspecified currency; used as the zero value.
  SHOP_CURRENCY_UNSPECIFIED = 0;
  // Gold — earned by completing tasks.
  SHOP_CURRENCY_GOLD = 1;
  // Gems — premium currency from achievements and purchases.
  SHOP_CURRENCY_GEMS = 2;
}

// ShopItem — a purchasable cosmetic or equipment item.
message ShopItem {
  // Unique item id.
  string id = 1;
  // Display name.
  string name = 2;
  // Display description.
  string description = 3;
  // Price in the currency chosen at purchase time.
  int64 price = 4;
  // Equipment slot this item occupies.
  api.shared.v1.EquipmentSlot slot = 5;
  // Rarity 
  api.shared.v1.EquipmentRarity rarity = 6;
}

// DailyDeal — a rotating discounted item.
message DailyDeal {
  // Id of the discounted item.
  string item_id = 1;
  // Discount percentage (0-100).
  int32 discount_percent = 2;
  // Time the deal expires, unix millis.
  int64 expires_at = 3;
}

// ListShopItemsRequest — optional filtering for the shop catalog.
message ListShopItemsRequest {
  // Optional filter by equipment category.
  string category = 1;
}

// ListShopItemsReply — the shop catalog.
message ListShopItemsReply {
  // The matching shop items.
  repeated ShopItem items = 1;
}

// GetDailyDealRequest — no parameters.
message GetDailyDealRequest {}

// GetDailyDealReply — the current daily deal.
message GetDailyDealReply {
  // The active deal; absent when no deal is running.
  DailyDeal deal = 1;
}

// BuyItemRequest — the item and currency to spend.
message BuyItemRequest {
  // Id of the item to purchase.
  string item_id = 1;
  // Currency used for the payment.
  ShopCurrency currency = 2;
}

// BuyItemReply — the purchase result.
message BuyItemReply {
  // The purchased item (now owned).
  ShopItem item = 1;
  // Remaining balance of the spent currency.
  int64 balance = 2;
}

// ListOwnedItemsRequest — no parameters.
message ListOwnedItemsRequest {}

// ListOwnedItemsReply — ids of all items the user owns.
message ListOwnedItemsReply {
  // Owned item ids.
  repeated string item_ids = 1;
}
